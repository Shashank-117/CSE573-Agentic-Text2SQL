[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cse573-text2sql-data"
version = "0.1.0"
description = "Dataset, schema metadata, and classical baseline starter for CSE 573 Text2SQL"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3.0", "scikit-learn>=1.3,<2.0", "sqlparse>=0.5,<0.7", "tqdm>=4.60", "rank-bm25>=0.2.2,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]
